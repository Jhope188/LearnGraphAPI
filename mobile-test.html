<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mobile Layout Test — iPhone &amp; Android</title>
<style>
  :root {
    --portrait-w: 402px;
    --portrait-h: 874px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #14171c;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: #e8f0f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #8a93a6; font-size: 0.8rem; margin-bottom: 20px; text-align: center; }

  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center; margin-bottom: 20px;
  }
  .controls select, .controls button {
    background: #1e2430; color: #e8f0f8; border: 1px solid #333c4d;
    border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer;
  }
  .controls button.active, .controls select:focus { border-color: #00b8b0; outline: none; }
  .controls label { font-size: 0.8rem; color: #8a93a6; }

  .stage {
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* Device frame */
  .device {
    background: #000;
    border-radius: 52px;
    padding: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: width 0.25s ease, height 0.25s ease;
  }
  .device.portrait { width: calc(var(--portrait-w) + 28px); height: calc(var(--portrait-h) + 28px); }
  .device.landscape { width: calc(var(--portrait-h) + 28px); height: calc(var(--portrait-w) + 28px); }

  .screen {
    width: 100%; height: 100%;
    background: #000;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
  }
  .notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 26px;
    background: #000;
    border-radius: 16px;
    z-index: 10;
  }
  .device.landscape .notch {
    top: 50%; left: 10px; transform: translateY(-50%) rotate(90deg);
  }

  /* Android punch-hole camera (Pixel-style) — small centered circle,
     not a Dynamic-Island pill. Shown instead of .notch when device=android. */
  .punch-hole {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 12px;
    background: #000;
    border: 1px solid #2a2a2a;
    border-radius: 50%;
    z-index: 10;
  }
  .device.landscape .punch-hole {
    top: 50%; left: 12px; transform: translateY(-50%);
  }
  .notch.hidden, .punch-hole.hidden { display: none; }

  iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #0a1628;
  }

  .dims {
    margin-top: 16px;
    font-size: 0.78rem;
    color: #8a93a6;
    text-align: center;
  }
  .dims strong { color: #00b8b0; }
</style>
</head>
<body>

<h1>Mobile Layout Tester</h1>
<div class="sub" id="sub-label">iPhone 17 Pro form factor (402 × 874 CSS px) &middot; live iframe of the deployed pages</div>

<div class="controls">
  <label for="page">Page:</label>
  <select id="page">
    <option value="https://conditionalaccess.tech/articles/entra/au-vs-rmau.html">au-vs-rmau.html</option>
    <option value="https://conditionalaccess.tech/articles/conditional-access/demo-ca-rpmsg-aip-exclusion.html">demo-ca-rpmsg-aip-exclusion.html</option>
    <option value="https://conditionalaccess.tech/articles/conditional-access/ca-mistakes-top-10.html">ca-mistakes-top-10.html</option>
    <option value="https://conditionalaccess.tech/articles/entra/mastering-groups-deep-dive.html">mastering-groups-deep-dive.html</option>
    <option value="https://conditionalaccess.tech/articles/entra/service-principal-shadow-admins.html">service-principal-shadow-admins.html (NHI)</option>
  </select>
  <label for="device-select">Device:</label>
  <select id="device-select">
    <option value="iphone" data-w="402" data-h="874" data-label="iPhone 17 Pro" data-punch="false">iPhone 17 Pro (402×874)</option>
    <option value="android" data-w="412" data-h="915" data-label="Pixel 8 (Android)" data-punch="true">Pixel 8 (412×915)</option>
  </select>
  <button id="btn-portrait" class="active">Portrait</button>
  <button id="btn-landscape">Landscape</button>
  <button id="btn-reload">Reload</button>
</div>

<div class="stage">
  <div class="device portrait" id="device">
    <div class="screen">
      <div class="notch" id="notch"></div>
      <div class="punch-hole hidden" id="punch-hole"></div>
      <iframe id="frame" src=""></iframe>
    </div>
  </div>
</div>

<div class="dims" id="dims">Rendering at <strong>402 × 874</strong></div>

<script>
  var deviceFrame = document.getElementById('device');
  var deviceSelect = document.getElementById('device-select');
  var frame = document.getElementById('frame');
  var pageSelect = document.getElementById('page');
  var dims = document.getElementById('dims');
  var subLabel = document.getElementById('sub-label');
  var btnP = document.getElementById('btn-portrait');
  var btnL = document.getElementById('btn-landscape');
  var btnReload = document.getElementById('btn-reload');
  var notchEl = document.getElementById('notch');
  var punchEl = document.getElementById('punch-hole');
  var currentOrientation = 'portrait';

  function loadPage() {
    var cacheBust = pageSelect.value + (pageSelect.value.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
    frame.src = cacheBust;
  }

  function applyDevice() {
    var opt = deviceSelect.options[deviceSelect.selectedIndex];
    var w = opt.getAttribute('data-w');
    var h = opt.getAttribute('data-h');
    var label = opt.getAttribute('data-label');
    var isPunch = opt.getAttribute('data-punch') === 'true';
    document.documentElement.style.setProperty('--portrait-w', w + 'px');
    document.documentElement.style.setProperty('--portrait-h', h + 'px');
    subLabel.textContent = label + ' form factor (' + w + ' × ' + h + ' CSS px) \u00b7 live iframe of the deployed pages';
    notchEl.classList.toggle('hidden', isPunch);
    punchEl.classList.toggle('hidden', !isPunch);
    setOrientation(currentOrientation);
  }

  function setOrientation(mode) {
    currentOrientation = mode;
    var opt = deviceSelect.options[deviceSelect.selectedIndex];
    var w = opt.getAttribute('data-w');
    var h = opt.getAttribute('data-h');
    deviceFrame.classList.remove('portrait', 'landscape');
    deviceFrame.classList.add(mode);
    btnP.classList.toggle('active', mode === 'portrait');
    btnL.classList.toggle('active', mode === 'landscape');
    dims.innerHTML = mode === 'portrait'
      ? 'Rendering at <strong>' + w + ' &times; ' + h + '</strong>'
      : 'Rendering at <strong>' + h + ' &times; ' + w + '</strong>';
  }

  pageSelect.addEventListener('change', loadPage);
  deviceSelect.addEventListener('change', applyDevice);
  btnP.addEventListener('click', function () { setOrientation('portrait'); });
  btnL.addEventListener('click', function () { setOrientation('landscape'); });
  btnReload.addEventListener('click', loadPage);

  applyDevice();
  loadPage();
</script>

</body>
</html>
