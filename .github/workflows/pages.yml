name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Matomo token
        env:
          MATOMO_TOKEN: ${{ secrets.MATOMO_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          token = os.getenv('MATOMO_TOKEN', '').strip()
          if not token:
            raise SystemExit('MATOMO_TOKEN secret is missing or empty')

          path = Path('index.html')
          text = path.read_text()
          text = text.replace('__MATOMO_TOKEN__', token)
          path.write_text(text)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
