<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUs vs RMAUs: What's That? | conditionalaccess.tech</title>
  <style>
    :root {
      --color-base:          #0a1628;
      --color-surface:       #0d2137;
      --color-surface-alt:   #112840;
      --color-border:        rgba(0, 184, 176, 0.12);
      --color-teal:          #00b8b0;
      --color-teal-dim:      #1a7f7a;
      --color-teal-glow:     rgba(26, 127, 122, 0.20);
      --color-ms-blue:       #0078d4;
      --color-text-primary:  #e8f0f8;
      --color-text-secondary:#7a9bb5;
      --color-text-dim:      #4a6a80;
      --color-ok:            #00b8b0;
      --color-warn:          #f5c842;
      --color-danger:        #e05533;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-base);
      color: var(--color-text-secondary);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--color-teal);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    /* ── Nav ── */
  .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 6vw; background: rgba(10,22,40,0.88);
    border-bottom: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(10px);
    font-family: 'DM Sans', sans-serif; }
  .wordmark { font-weight: 500; font-size: 0.95rem; letter-spacing: 0.01em;
    color: var(--off-white); text-decoration: none; white-space: nowrap; }
  .wordmark span { color: var(--teal); }
  .site-nav { display: flex; gap: 1.75rem; align-items: center; }
  .site-nav a { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--warm-gray); text-decoration: none; transition: color 0.2s; padding: 0.5rem 0; }
  .site-nav a:hover { color: var(--off-white); }
  .site-nav a.active { color: var(--teal); }
  @media (max-width: 640px) { .site-nav { gap: 1.1rem; }
    .site-nav a.hide-mobile { display: none; } }
